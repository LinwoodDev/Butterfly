      two_letters_code:
        pt-BR: pt-br
        zh-CN: zh
        zh-TW: zh-hant
  - source: /metadata/en-US/full_description.txt
    translation: /metadata/%locale%/full_description.txt
  - source: /metadata/en-US/short_description.txt
    translation: /metadata/%locale%/short_description.txt
