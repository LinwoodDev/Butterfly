name: Flutter build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - stable
      - nightly
  release:
    types: [published]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    defaults:
      run:
        working-directory: app
    runs-on: ubuntu-26.04
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: 🔧 Setup java
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: 🦀 Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: app
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: 📦 Get dependencies
        run: |
          flutter pub get
      - name: Import files
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          cd android
          if [[ -n "$KEY_PROPERTIES" ]] ; then echo "$KEY_PROPERTIES" | base64 --decode > key.properties  ; fi
          if [[ -n "$KEY_JKS" ]] ; then echo "$KEY_JKS" | base64 --decode > key.jks  ; fi
      #- run: flutter test
      - name: 🏭 Build architecture nightly
        if: ${{ github.ref != 'refs/tags/stable' && (github.event_name != 'release' || github.event.release.prerelease) }}
        run: |
          flutter build apk -v --release --target-platform android-arm,android-arm64,android-x64 --split-per-abi --flavor nightly
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-nightly-release.apk linwood-butterfly-android-arm.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-nightly-release.apk linwood-butterfly-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-nightly-release.apk linwood-butterfly-android-x86_64.apk
      - name: 🏭 Build architecture nightly (legacy packaging)
        if: ${{ github.ref != 'refs/tags/stable' && (github.event_name != 'release' || github.event.release.prerelease) }}
        run: |
          USE_LEGACY_PACKAGING=true flutter build apk -v --release --target-platform android-arm,android-arm64,android-x64 --split-per-abi --flavor nightly
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-nightly-release.apk linwood-butterfly-android-arm-legacy.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-nightly-release.apk linwood-butterfly-android-arm64-legacy.apk
          cp build/app/outputs/flutter-apk/app-x86_64-nightly-release.apk linwood-butterfly-android-x86_64-legacy.apk
      - name: 🏭 Build architecture production
        if: ${{ github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease) }}
        run: |
          flutter build apk -v --release --target-platform android-arm,android-arm64,android-x64 --split-per-abi --flavor production
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-production-release.apk linwood-butterfly-android-arm.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-production-release.apk linwood-butterfly-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-production-release.apk linwood-butterfly-android-x86_64.apk
      - name: 🏭 Build architecture production (legacy packaging)
        if: ${{ github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease) }}
        run: |
          USE_LEGACY_PACKAGING=true flutter build apk -v --release --target-platform android-arm,android-arm64,android-x64 --split-per-abi --flavor production
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-production-release.apk linwood-butterfly-android-arm-legacy.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-production-release.apk linwood-butterfly-android-arm64-legacy.apk
          cp build/app/outputs/flutter-apk/app-x86_64-production-release.apk linwood-butterfly-android-x86_64-legacy.apk
      - name: 📊 Analyze nightly Android arm64 size
        if: ${{ github.ref != 'refs/tags/stable' && (github.event_name != 'release' || github.event.release.prerelease) }}
        run: |
          flutter build apk -v --release --flavor nightly --target-platform android-arm64 --split-per-abi --analyze-size --code-size-directory=build/size-analysis/android-arm64-nightly
          cp "$HOME"/.flutter-devtools/apk-code-size-analysis_*.json build/size-analysis/android-arm64-nightly/
      - name: 📊 Analyze production Android arm64 size
        if: ${{ github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease) }}
        run: |
          flutter build apk -v --release --flavor production --target-platform android-arm64 --split-per-abi --analyze-size --code-size-directory=build/size-analysis/android-arm64-production
          cp "$HOME"/.flutter-devtools/apk-code-size-analysis_*.json build/size-analysis/android-arm64-production/
      - name: Archive size analysis
        uses: actions/upload-artifact@v7
        with:
          name: android-size-analysis
          path: app/build/size-analysis/
          if-no-files-found: error
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: apk-arm-build
          path: app/linwood-butterfly-android-arm.apk
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: apk-arm64-build
          path: app/linwood-butterfly-android-arm64.apk
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: apk-x86_64-build
          path: app/linwood-butterfly-android-x86_64.apk
      - name: Archive (legacy arm)
        uses: actions/upload-artifact@v7
        with:
          name: apk-arm-build-legacy
          path: app/linwood-butterfly-android-arm-legacy.apk
      - name: Archive (legacy arm64)
        uses: actions/upload-artifact@v7
        with:
          name: apk-arm64-build-legacy
          path: app/linwood-butterfly-android-arm64-legacy.apk
      - name: Archive (legacy x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: apk-x86_64-build-legacy
          path: app/linwood-butterfly-android-x86_64-legacy.apk
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - image: windows-2025
            name: x86_64
            dir: x64
          - image: windows-11-arm
            name: arm64
            dir: arm64
    runs-on: ${{ matrix.arch.image }}
    defaults:
      run:
        working-directory: app
    env:
      BUILD_FLAVOR: ${{ (github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease)) && 'production' || 'nightly' }}
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: Make yq tool available on Windows runners
        run: |
          choco install yq
          choco install innosetup
      - name: 🦀 Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: app
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          channel: "master"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
      - name: ✅ Enable platforms
        run: flutter config --enable-windows-desktop
      - name: 📦 Get dependencies
        run: |
          flutter pub get
      - name: 🏭 Build nightly
        if: ${{ github.ref != 'refs/tags/stable' && (github.event_name != 'release' || github.event.release.prerelease) }}
        run: |
          flutter build windows -v --release --flavor nightly
      - name: 🏭 Build production
        if: ${{ github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease) }}
        run: |
          flutter build windows -v --release --flavor production
      - name: 📊 Analyze Windows x86_64 size
        if: ${{ matrix.arch.name == 'x86_64' }}
        run: |
          flutter build windows -v --release --flavor ${{ env.BUILD_FLAVOR }} --analyze-size --code-size-directory=build/size-analysis/windows-x86_64
          New-Item -ItemType Directory -Force build/size-analysis/windows-x86_64 | Out-Null
          Copy-Item "$env:USERPROFILE/.flutter-devtools/*-code-size-analysis_*.json" build/size-analysis/windows-x86_64/
      - name: Build setup
        shell: pwsh
        run: |
          Get-Content pubspec.yaml | Select-String -Pattern 'version:\s(.+)\+'  | % {Set-Item -Path Env:BUTTERFLY_VERSION -Value "$($_.matches.groups[1])"}
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' /DMyAppVersion=$Env:BUTTERFLY_VERSION /DMyAppArch=${{ matrix.arch.dir }} /DMyAppFlavor=${{ env.BUILD_FLAVOR }} ButterflySetup.iss
      - name: Copy portable start script
        run: |
          cp scripts/start.bat build/windows/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/runner/Release/
          cp build/windows/${{ matrix.arch.dir }}/linwood-butterfly-windows-setup.exe linwood-butterfly-windows-setup-${{ matrix.arch.name }}.exe
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch.name }}-build
          path: |
            app/build/windows/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/runner/Release/**
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch.name }}-setup
          path: |
            app/linwood-butterfly-windows-setup-${{ matrix.arch.name }}.exe
      - name: Archive size analysis
        if: ${{ matrix.arch.name == 'x86_64' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64-size-analysis
          path: app/build/size-analysis/windows-x86_64/
          if-no-files-found: error
  build-msix:
    name: build-msix
    runs-on: windows-2025
    defaults:
      run:
        working-directory: app
    env:
      BUILD_FLAVOR: ${{ (github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease)) && 'production' || 'nightly' }}
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: 🦀 Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: app
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: 📦 Get dependencies
        run: |
          flutter pub get
      - name: 🎨 Apply native branding
        run: dart run scripts/apply_branding.dart ${{ env.BUILD_FLAVOR }} windows
      - name: 🏭 Build MSIX
        shell: pwsh
        run: |
          flutter build windows --release --flavor ${{ env.BUILD_FLAVOR }}
          New-Item -ItemType Directory -Force build/windows/x64/runner | Out-Null
          Copy-Item -Recurse -Force build/windows/x64/${{ env.BUILD_FLAVOR }}/runner/Release build/windows/x64/runner/
          dart run msix:create --build-windows=false
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: msix-build
          path: app/build/windows/x64/runner/Release/butterfly.msix
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - image: ubuntu-24.04
            name: x86_64
            dir: x64
            appimage: x86_64
            gdk_pixbuf_dev: libgdk-pixbuf2.0-dev
          - image: ubuntu-24.04-arm
            name: arm64
            dir: arm64
            appimage: aarch64
            gdk_pixbuf_dev: libgdk-pixbuf2.0-dev
    runs-on: ${{ matrix.arch.image }}
    defaults:
      run:
        working-directory: app
    env:
      BUILD_FLAVOR: ${{ (github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease)) && 'production' || 'nightly' }}
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: Get dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip \
            python3-setuptools \
            desktop-file-utils \
            ${{ matrix.arch.gdk_pixbuf_dev }} \
            fakeroot \
            strace \
            fuse \
            libgtk-3-dev \
            libx11-dev \
            pkg-config \
            cmake \
            ninja-build \
            libblkid-dev \
            liblzma-dev \
            clang \
            dpkg-dev \
            patchelf \
            alien \
            libsecret-1-dev \
            libjsoncpp-dev \
            rpm
      - name: 🦀 Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: app
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          channel: "master"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
      - name: ✅ Enable platforms
        run: |
          rm -f "$(dirname "$(dirname "$(command -v flutter)")")/engine/src/.gn"
          flutter config --enable-linux-desktop
      - name: 📦 Get dependencies
        run: |
          flutter pub get
      - name: 🎨 Apply native branding
        run: dart run scripts/apply_branding.dart ${{ env.BUILD_FLAVOR }} linux
      - name: 🏭 Build nightly
        if: ${{ github.ref != 'refs/tags/stable' && (github.event_name != 'release' || github.event.release.prerelease) }}
        run: |
          flutter build linux -v --release --flavor nightly
      - name: 🏭 Build production
        if: ${{ github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease) }}
        run: |
          flutter build linux -v --release --flavor production
      - name: 📊 Analyze Linux x86_64 size
        if: ${{ matrix.arch.name == 'x86_64' }}
        run: |
          flutter build linux -v --release --flavor ${{ env.BUILD_FLAVOR }} --analyze-size --code-size-directory=build/size-analysis/linux-x86_64
          cp "$HOME"/.flutter-devtools/*-code-size-analysis_*.json build/size-analysis/linux-x86_64/
      - name: 🏭 Make binary executable
        run: |
          chmod +x build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle/butterfly
      - name: Update files to arm64
        if: ${{ matrix.arch.dir == 'arm64' }}
        run: |
          sed -i 's/^Architecture: amd64/Architecture: arm64/' linux/debian/DEBIAN/control
      - name: Build .deb executable
        run: |
          cp -fr build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle linux/debian/usr/bin
          dpkg-deb --build --root-owner-group linux/debian
          cp linux/*.deb linwood-butterfly-linux-${{ matrix.arch.name }}.deb
      - name: Build .rpm executable
        run: |
          bash scripts/build-rpm.sh -d ${{ matrix.arch.dir }} -b ${{ matrix.arch.name }} -f ${{ env.BUILD_FLAVOR }}
      - name: Build .AppImage executable
        run: |
          wget -O appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch.appimage }}.AppImage
          chmod +x appimagetool.AppImage
          # Build AppDir
          mkdir -p AppDir/usr/bin
          # move bundle folder to AppDir
          cp build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle/* AppDir/usr/bin/ -r
          mkdir -p AppDir/usr/share/icons/hicolor
          cp linux/debian/usr/share/icons/hicolor AppDir/usr/share/icons/ -r
          mkdir -p AppDir/usr/share/metainfo/
          cp linux/debian/usr/share/metainfo/dev.linwood.butterfly.appdata.xml AppDir/usr/share/metainfo/
          mkdir -p AppDir/usr/share/applications/
          cp linux/debian/usr/share/applications/dev.linwood.butterfly.desktop AppDir/usr/share/applications/
          ln -s usr/share/applications/dev.linwood.butterfly.desktop AppDir/dev.linwood.butterfly.desktop
          ln -s usr/bin/butterfly AppDir/AppRun
          ln -s usr/share/icons/hicolor/256x256/apps/dev.linwood.butterfly.png AppDir/dev.linwood.butterfly.png
          # Build AppImage
          UPDATE_INFO="gh-releases-zsync|LinwoodDev|butterfly|stable|linwood-butterfly-linux-${{ matrix.arch.name }}.AppImage.zsync"
          if [[ "${{ github.ref }}" == "refs/tags/nightly" ]]; then
            UPDATE_INFO="gh-releases-zsync|LinwoodDev|butterfly|nightly|linwood-butterfly-linux-${{ matrix.arch.name }}.AppImage.zsync"
          fi
          ./appimagetool.AppImage -u "$UPDATE_INFO" AppDir linwood-butterfly-linux-${{ matrix.arch.name }}.AppImage
      - name: Copy nessessary files
        run: |
          BRANDING_LOGO=images/logo.svg
          if [[ "${{ env.BUILD_FLAVOR }}" == "nightly" ]]; then BRANDING_LOGO=images/nightly.svg; fi
          cp "$BRANDING_LOGO" build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle/dev.linwood.butterfly.svg
          mkdir -p build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle/usr/share
          cp -r linux/debian/usr/share build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle/usr
      - name: Copy portable start script
        run: |
          chmod +x scripts/start.sh
          cp scripts/start.sh build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch.name }}-build
          path: |
            app/build/linux/${{ matrix.arch.dir }}/${{ env.BUILD_FLAVOR }}/release/bundle/**
      - name: Archive .deb
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch.name }}-deb
          path: |
            app/linwood-butterfly-linux-${{ matrix.arch.name }}.deb
      - name: Archive .rpm
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch.name }}-rpm
          path: |
            app/build/linwood-butterfly-linux-${{ matrix.arch.name }}.rpm
      - name: Archive .AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch.name }}-appimage
          path: |
            app/linwood-butterfly-linux-${{ matrix.arch.name }}.AppImage
            app/linwood-butterfly-linux-${{ matrix.arch.name }}.AppImage.zsync
      - name: Archive size analysis
        if: ${{ matrix.arch.name == 'x86_64' }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-size-analysis
          path: app/build/size-analysis/linux-x86_64/
          if-no-files-found: error
  build-snap:
    name: build-snap
    strategy:
      fail-fast: false
      matrix:
        arch:
          - image: ubuntu-26.04
            name: x86_64
            dir: x64
            appimage: x86_64
          - image: ubuntu-26.04-arm
            name: arm64
            dir: arm64
            appimage: aarch64
    runs-on: ${{ matrix.arch.image }}
    env:
      BUILD_FLAVOR: ${{ (github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease)) && 'production' || 'nightly' }}
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: Add snapcraft directory
        run: |
          mkdir -p snap
          cp app/snapcraft.yaml snap/snapcraft.yaml
      - name: 🎨 Apply native branding
        if: ${{ env.BUILD_FLAVOR == 'nightly' }}
        run: |
          sed -i "s/flutter build linux --release --verbose --target lib\/main.dart/flutter build linux --release --verbose --target lib\/main.dart --flavor nightly/" snap/snapcraft.yaml
          sed -i "s/title: 'Linwood Butterfly'/title: 'Linwood Butterfly Nightly'/" snap/snapcraft.yaml
          cp app/linux/branding/nightly-256.png app/linux/debian/usr/share/icons/hicolor/256x256/apps/dev.linwood.butterfly.png
          sed -i 's/Name=Linwood Butterfly/Name=Linwood Butterfly Nightly/' app/linux/debian/usr/share/applications/dev.linwood.butterfly.desktop
          sed -i 's/<name>Linwood Butterfly<\/name>/<name>Linwood Butterfly Nightly<\/name>/' app/linux/debian/usr/share/metainfo/dev.linwood.butterfly.appdata.xml
      - uses: snapcore/action-build@v1
        id: build
      - uses: snapcore/action-publish@v1
        continue-on-error: true
        name: Publish Snap to Store
        if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/tags/nightly' || github.ref == 'refs/tags/stable' }}
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ github.ref == 'refs/heads/develop' && 'edge' || github.ref == 'refs/heads/main' && 'candidate' || github.ref == 'refs/tags/nightly' && 'beta' || 'stable' }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch.name }}-snap
          path: ${{ steps.build.outputs.snap }}
  build-macos:
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    env:
      BUILD_FLAVOR: ${{ (github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease)) && 'production' || 'nightly' }}
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: 🦀 Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: app
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: ✅ Enable platforms
        run: flutter config --enable-macos-desktop
      - name: 📦 Get dependencies
        run: |
          flutter pub get
      - name: 🎨 Apply native branding
        run: dart run scripts/apply_branding.dart ${{ env.BUILD_FLAVOR }} macos
      - name: 🏭 Build
        run: |
          flutter build macos -v --release --dart-define=flavor=${{ env.BUILD_FLAVOR }}
      - name: Zip file
        working-directory: app/build/macos/Build/Products/Release
        run: zip --symlinks -qr linwood-butterfly-macos.zip butterfly.app
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install appdmg
        run: |
          python3 -m pip install setuptools
          npm install -g appdmg
      - name: Create dmg
        run: |
          appdmg DmgSetup.json linwood-butterfly-macos.dmg
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: |
            app/build/macos/Build/Products/Release/linwood-butterfly-macos.zip
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            app/linwood-butterfly-macos.dmg

  build-ipa:
    name: build-ipa (iOS)
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    env:
      BUILD_FLAVOR: ${{ (github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease)) && 'production' || 'nightly' }}
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: 🦀 Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: app
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: 📦 Get dependencies
        run: |
          flutter pub get
      - name: 🎨 Apply native branding
        run: dart run scripts/apply_branding.dart ${{ env.BUILD_FLAVOR }} ios
      - name: 🏭 Build
        run: |
          flutter build ios --release --no-codesign -v --dart-define=flavor=${{ env.BUILD_FLAVOR }}
      - name: Packing IPA
        run: |
          cd build/ios/iphoneos/
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          rm -f linwood-butterfly-ios.ipa
          zip -vr linwood-butterfly-ios.ipa Payload/
      #          ls -l linwood-butterfly-ios.ipa
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: ipa-build
          path: app/build/ios/iphoneos/linwood-butterfly-ios.ipa
          compression-level: 0 #ipa is already compressed
  build-docker:
    runs-on: ubuntu-26.04
    if: github.event_name != 'pull_request'
    env:
      BUILD_FLAVOR: ${{ (github.ref == 'refs/tags/stable' || (github.event_name == 'release' && !github.event.release.prerelease)) && 'production' || 'nightly' }}
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
      - name: Set Docker tag
        id: docker_tag
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            echo "tag=dev" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == refs/tags/v* || "${GITHUB_REF}" == "refs/tags/stable" || "${GITHUB_REF}" == "refs/tags/nightly" ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "tag=unknown" >> $GITHUB_ENV
          fi
      - name: Log Docker tag
        run: echo "Docker tag is ${{ env.tag }}"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        if: ${{ env.tag != 'unknown' }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: linwooddev/butterfly:${{ env.tag }}
          build-args: |
            BUILD_FLAVOR=${{ env.BUILD_FLAVOR }}
  deploy:
    runs-on: ubuntu-26.04
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.setup.outputs.BUTTERFLY_VERSION }}
      build_number: ${{ steps.setup.outputs.BUTTERFLY_BUILD_NUMBER }}
    needs:
      - build-apk
      - build-windows
      - build-linux
      - build-macos
      - build-ipa
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
        env:
